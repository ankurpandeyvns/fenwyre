# The screen locker greeter (spawned by KWin) loads its lock screen QML from the
# Plasma/Shell package named by PLASMA_DEFAULT_SHELL (plasmashellrc [Shell] ShellPackage
# would also switch plasmashell's desktop shell, so only KWin gets this variable).
# net.local.macos.lockscreen only contains contents/lockscreen; remove this file to
# return to the stock Plasma lock screen. Takes effect at the next login.
[Service]
Environment=PLASMA_DEFAULT_SHELL=net.local.macos.lockscreen
