# kde-macos-parity: Sony "Clear Bass"-style tune for the WH-1000XM3, applied before encoding so it works on LDAC
# (the headphones bypass their own EQ on LDAC). A WirePlumber smart filter: inserted automatically in front of the
# headphones only, which stay the default output and keep hardware (AVRCP) volume.
#   -6 dB preamp (headroom, avoids clipping the encoder on bass-heavy tracks)
#   +6 dB low shelf at 120 Hz, Q 0.7
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Sony Clear Bass EQ"
      media.name       = "Sony Clear Bass EQ"
      filter.graph = {
        nodes = [
          { type = builtin name = preamp label = linear     control = { "Mult" = 0.5012 "Add" = 0.0 } }
          { type = builtin name = bass   label = bq_lowshelf control = { "Freq" = 120.0 "Q" = 0.7 "Gain" = 6.0 } }
        ]
        links = [ { output = "preamp:Out" input = "bass:In" } ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name   = "effect_input.sony_clearbass"
        media.class = Audio/Sink
        filter.smart = true
        filter.smart.name = "sony-clearbass"
        filter.smart.target = { node.name = "bluez_output.XX_XX_XX_XX_XX_XX.1" }
      }
      playback.props = {
        node.name    = "effect_output.sony_clearbass"
        node.passive = true
        stream.dont-remix = true
      }
    }
  }
]
