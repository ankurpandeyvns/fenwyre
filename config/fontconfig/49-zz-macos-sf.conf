<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- macOS fonts: map generic families to San Francisco before 50-omarchy.conf rewrites them. -->
<fontconfig>
  <match target="pattern"><test qual="any" name="family"><string>sans-serif</string></test><edit name="family" mode="assign" binding="strong"><string>SF Pro Text</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>system-ui</string></test><edit name="family" mode="assign" binding="strong"><string>SF Pro Text</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>-apple-system</string></test><edit name="family" mode="assign" binding="strong"><string>SF Pro Text</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>BlinkMacSystemFont</string></test><edit name="family" mode="assign" binding="strong"><string>SF Pro Text</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>monospace</string></test><edit name="family" mode="assign" binding="strong"><string>SF Mono</string></edit></match>
</fontconfig>
