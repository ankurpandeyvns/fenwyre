# kde-macos-parity: LDAC at the fixed top bitrate (909/990 kbps) instead of adaptive, which on Apple silicon
# (Wi-Fi and Bluetooth share the radio) was measured at ~660 kbps. ldac.quality is a per-device property.
monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = { update-props = { bluez5.a2dp.ldac.quality = "hq" } }
  }
]
