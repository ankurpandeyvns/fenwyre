# kde-macos-parity: LDAC quality. "auto" (adaptive) backs the bitrate off when the radio link dips, so audio
# doesn't skip; on this M1 Max it settled around 660-680 kbps. "hq" locks 990 kbps (fuller sound, but brief
# radio dips then skip: nothing left to back off to); "sq" is a fixed 660. ldac.quality is a per-device property:
# it only works in monitor.bluez.rules, not monitor.bluez.properties.
monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = { update-props = { bluez5.a2dp.ldac.quality = "auto" } }
  }
]
