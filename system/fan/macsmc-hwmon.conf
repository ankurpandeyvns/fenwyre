# kde-macos-parity fan profiles (mac-fand). fan_control only makes the fan targets writable; the SMC
# keeps control until mac-fand writes a target, and gets it back when mac-fand stops.
# The SoC die keys are the M1 Pro/Max CPU core and GPU sensors Stats uses (Modules/Sensors/values.swift).
options macsmc_hwmon fan_control=1 fan_stop=1 soc_die_keys=Tp01,Tp05,Tp09,Tp0D,Tp0H,Tp0L,Tp0P,Tp0T,Tp0X,Tp0b,Tg05,Tg0D,Tg0L,Tg0T
