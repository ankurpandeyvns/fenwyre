# kde-macos-parity: login screen. Sorts after 99-zz-kde.conf.
[Theme]
# Breeze copy that shows the login form on the main display only (theme.conf primaryOutput)
Current=breeze-mac

[Wayland]
# Only Plasma in the session list; Hyprland/Omarchy stay installed, just not offered here.
SessionDir=/usr/local/share/sddm-sessions
